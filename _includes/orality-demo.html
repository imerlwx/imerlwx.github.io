<div class="thought-demo" data-thought-demo>
  <div class="thought-canvas" aria-label="An empty canvas waiting for a spoken thought" data-thought-canvas>
    <svg class="thought-connectors" viewBox="0 0 420 210" preserveAspectRatio="none" aria-hidden="true"><path data-thought-connector="1" d="M210 63 C210 110 105 100 105 151" hidden/><path data-thought-connector="2" d="M210 63 C210 110 315 100 315 151" hidden/></svg>
    <span class="thought-node node-main" data-node="0" hidden>A place to think</span>
    <span class="thought-node node-left" data-node="1" hidden>Keep my own words</span>
    <span class="thought-node node-right" data-node="2" hidden>Find a direction</span>
  </div>
  <button type="button" class="spoken-thought speech-input" data-thought-speak aria-label="Simulate the next spoken thought in Orality" title="Speak a thought" disabled><span class="waveform" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span data-utterance>“I want a place to think out loud.”</span><span class="speech-cue" aria-hidden="true">→</span>{% include speech-hint.html %}</button>
  <span class="visually-hidden" role="status" data-demo-step aria-live="polite">Speak a thought to add the first idea.</span>
</div>
